[package]
name = "sugar-archive"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
bzip2 = "0.5"
flate2 = "1"
rfd = "0.15"
sevenz-rust2 = "0.20"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-drag = "2"
tar = "0.4"
tempfile = "3"
xz2 = "0.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
